name: Test administrative attendance module
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/resumen-validacion-whatsapp]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check index.js
      - run: node --check comandos-admin.js
      - run: node --check jornadas-admin.js
